[mypy]
# Run mypy from inside the custom_components directory to avoid duplicate-module
# detection when the package also appears under the repository root.
python_version = 3.13
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_configs = False
namespace_packages = True
mypy_path = .

# Use stricter checks for edited modules if desired (enable incrementally)
# disallow_untyped_defs = True
